<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নিউজ পোর্টাল</title>
<style>
@font-face{font-family:"SolaimanLipi";src:url("fonts/SolaimanLipi.ttf") format("truetype");font-display:swap}
:root{--bg:#f4f6f8;--ink:#14202b;--mut:#5d6b78;--g:#0b6b4b;--r:#d6322e;--line:#dde3e8;--card:#fff}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"SolaimanLipi","Noto Sans Bengali","Kalpurush","Nirmala UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:17px}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{background:var(--g);color:#fff;font-size:14px;padding:6px 0}
.top .wrap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{padding:18px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand a{font-size:clamp(30px,6vw,46px);font-weight:700;line-height:1.2;color:var(--g)}
.brand a i{display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--r);margin-right:.3em}
.search{flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;font:inherit;background:#fff}
nav{background:#fff;border-top:1px solid var(--line);border-bottom:3px solid var(--g);position:sticky;top:0;z-index:5}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 16px;max-width:1180px;margin:auto}
#nav::-webkit-scrollbar{display:none}
#nav button{border:0;background:none;font:inherit;padding:12px 16px;white-space:nowrap;cursor:pointer;color:var(--ink)}
#nav button.on{background:var(--g);color:#fff}
.tickbar{background:#fff;border-bottom:1px solid var(--line);overflow:hidden;display:flex;align-items:center}
.tickbar b{background:var(--r);color:#fff;padding:6px 14px;flex:none;font-weight:400}
.tick{overflow:hidden;white-space:nowrap;flex:1}
.tick div{display:inline-block;padding-left:100%;animation:m 50s linear infinite}
.tick a{margin-right:48px}
@keyframes m{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.tick div{animation:none;padding-left:12px}}
main{padding:22px 16px 40px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px}
.hero{position:relative;display:block;border-radius:6px;overflow:hidden;background:#0d2a21;min-height:340px;color:#fff}
.hero img,.hero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(5,20,15,.92))}
.hero .tx{position:absolute;left:0;right:0;bottom:0;padding:22px}
.hero h2{font-size:clamp(26px,4.4vw,40px);line-height:1.35;margin:6px 0}
.tag{display:inline-block;background:var(--r);color:#fff;font-size:14px;padding:0 10px;border-radius:3px;line-height:1.7}
.meta{font-size:14px;color:var(--mut)}
.hero .meta{color:#cfe3da}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.card{background:var(--card);border-radius:6px;overflow:hidden;border:1px solid var(--line);display:block}
.card img,.card .ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.card div.b{padding:12px 14px 14px}
.card h3{font-size:21px;line-height:1.45;margin:4px 0}
.ph{background:linear-gradient(135deg,#0b6b4b,#14202b)}
h4.sec{font-size:22px;margin:30px 0 12px;padding-left:12px;border-left:5px solid var(--r)}
.row{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row img,.row .ph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px}
.row h3{font-size:21px;line-height:1.45}
.row p{color:var(--mut);font-size:16px}
aside .box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 16px;position:sticky;top:64px}
aside h4{font-size:20px;margin-bottom:6px}
aside li{list-style:none;padding:10px 0;border-top:1px solid var(--line);line-height:1.5}
.art{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:clamp(16px,4vw,36px)}
.art h1{font-size:clamp(28px,5vw,42px);line-height:1.4;margin:8px 0}
.art img{width:100%;border-radius:4px;margin:16px 0;max-height:440px;object-fit:cover}
.art p{margin:0 0 1.1em;font-size:19px;line-height:1.95}
.back{display:inline-block;margin-bottom:14px;color:var(--g)}
.msg{padding:40px 0;text-align:center;color:var(--mut)}
footer{background:var(--ink);color:#b9c4cd;text-align:center;padding:22px 16px;font-size:15px}
@media(max-width:900px){.lay{grid-template-columns:1fr}aside .box{position:static}}
@media(max-width:600px){.two{grid-template-columns:1fr}.row{grid-template-columns:110px 1fr;gap:12px}.row p{display:none}.row h3,.card h3{font-size:18px}.hero{min-height:280px}body{font-size:16px}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><span id="date"></span><span>বাংলা সংবাদ</span></div></div>
<div class="wrap brand"><a href="#" id="logo"><i></i><span id="sn"></span></a><div class="search"><input id="q" type="search" placeholder="খবর খুঁজুন" aria-label="খবর খুঁজুন"></div></div>
<nav aria-label="বিভাগ"><div id="nav"></div></nav>
<div class="tickbar"><b>সর্বশেষ</b><div class="tick"><div id="tick"></div></div></div>
<main class="wrap" id="app"><p class="msg">লোড হচ্ছে...</p></main>
<footer>© <span id="yr"></span> <span id="sn2"></span>। সর্বস্বত্ব সংরক্ষিত।</footer>
<script src="config.js"></script>
<script>
var API=window.API_URL||'',NAME=window.SITE_NAME||'নিউজ পোর্টাল';
var DEMO=[
{id:'d1',title:'ডেমো খবর: আপনার সংবাদ পোর্টাল প্রস্তুত',category:'জাতীয়',summary:'Google Sheet যুক্ত করলে এখানে আসল খবর দেখাবে।',content:'এটি একটি ডেমো খবর।\nconfig.js ফাইলে API_URL বসালে Google Sheet-এর খবর এখানে আসবে।',image:'',author:'ডেস্ক',date:new Date().toISOString(),status:'published'},
{id:'d2',title:'ডেমো খবর: খেলাধুলার একটি শিরোনাম',category:'খেলা',summary:'নমুনা সারসংক্ষেপ।',content:'নমুনা খবরের বিস্তারিত।',image:'',author:'ডেস্ক',date:new Date().toISOString(),status:'published'},
{id:'d3',title:'ডেমো খবর: প্রযুক্তি বিভাগের নমুনা',category:'প্রযুক্তি',summary:'নমুনা সারসংক্ষেপ।',content:'নমুনা খবরের বিস্তারিত।',image:'',author:'ডেস্ক',date:new Date().toISOString(),status:'published'}];
var DATA=[],CAT='সব',Q='';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function bn(d){try{var x=new Date(d);return isNaN(x)?'':x.toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'})}catch(e){return''}}
function im(a){return a.image?'<img src="'+esc(a.image)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=ph></div>\'">':'<div class="ph"></div>'}
function card(a){return '<a class="card" href="#'+esc(a.id)+'">'+im(a)+'<div class="b"><span class="meta">'+esc(a.category)+'</span><h3>'+esc(a.title)+'</h3><span class="meta">'+bn(a.date)+'</span></div></a>'}
function row(a){return '<a class="row" href="#'+esc(a.id)+'">'+im(a)+'<div><span class="meta">'+esc(a.category)+' · '+bn(a.date)+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.summary)+'</p></div></a>'}
function home(){
  var cats=['সব'],i;DATA.forEach(function(x){if(x.category&&cats.indexOf(x.category)<0)cats.push(x.category)});
  $('#nav').innerHTML=cats.map(function(c){return '<button data-c="'+esc(c)+'" class="'+(c===CAT?'on':'')+'">'+esc(c)+'</button>'}).join('');
  $('#tick').innerHTML=DATA.slice(0,6).map(function(x){return '<a href="#'+esc(x.id)+'">'+esc(x.title)+'</a>'}).join('');
  var L=DATA.filter(function(x){return(CAT==='সব'||x.category===CAT)&&(!Q||(x.title+' '+x.summary).indexOf(Q)>-1)});
  if(!L.length){$('#app').innerHTML='<p class="msg">কোনো খবর পাওয়া যায়নি।</p>';return}
  var h=L[0],t=L.slice(1,3),r=L.slice(3);
  var s='<div class="lay"><section><a class="hero" href="#'+esc(h.id)+'">'+im(h)+'<span class="ov"></span><span class="tx"><span class="tag">'+esc(h.category)+'</span><h2>'+esc(h.title)+'</h2><span class="meta">'+bn(h.date)+'</span></span></a>';
  if(t.length)s+='<div class="two">'+t.map(card).join('')+'</div>';
  if(r.length)s+='<h4 class="sec">আরও খবর</h4>'+r.map(row).join('');
  s+='</section><aside><div class="box"><h4>সর্বশেষ</h4><ul>'+DATA.slice(0,6).map(function(x){return '<li><a href="#'+esc(x.id)+'">'+esc(x.title)+'</a><br><span class="meta">'+bn(x.date)+'</span></li>'}).join('')+'</ul></div></aside></div>';
  $('#app').innerHTML=s;document.title=NAME;
}
function article(a){
  var body=String(a.content||'').split(/\n+/).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
  $('#app').innerHTML='<article class="art"><a class="back" href="#">← প্রথম পাতায় ফিরুন</a><br><span class="tag">'+esc(a.category)+'</span><h1>'+esc(a.title)+'</h1><div class="meta">'+esc(a.author)+' · '+bn(a.date)+'</div>'+(a.image?'<img src="'+esc(a.image)+'" alt="" onerror="this.remove()">':'')+body+'</article>';
  document.title=a.title+' | '+NAME;
}
function render(){var id=location.hash.slice(1),a=DATA.filter(function(x){return x.id===id})[0];if(a)article(a);else home();window.scrollTo(0,0)}
function load(){
  if(!API){DATA=DEMO;render();return}
  fetch(API+(API.indexOf('?')>-1?'&':'?')+'t='+Date.now()).then(function(r){return r.json()}).then(function(j){DATA=j.items||[];render()}).catch(function(){$('#app').innerHTML='<p class="msg">খবর লোড করা যায়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p>'});
}
$('#nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b){CAT=b.getAttribute('data-c');location.hash='';render()}});
$('#q').addEventListener('input',function(e){Q=e.target.value.trim();if(location.hash)location.hash='';else render()});
window.addEventListener('hashchange',render);
$('#sn').textContent=NAME;$('#sn2').textContent=NAME;$('#yr').textContent=new Date().getFullYear().toLocaleString('bn-BD',{useGrouping:false});
$('#date').textContent=new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
load();
</script>
</body>
</html>
